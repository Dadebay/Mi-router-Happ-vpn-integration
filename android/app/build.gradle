plugins {
    id 'com.android.application'
}

def signingFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.dadebay.happrouter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dadebay.happrouter'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
